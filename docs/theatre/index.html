<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vasool &mdash; the episode theatre</title>
<meta name="description" content="Watch thirteen guards rule on one payment recovery, one at a time, and then break the receipt's seal yourself in the browser. Replayed from the agent's own run.">
<meta name="color-scheme" content="dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
/* ============================================================================
   THE EPISODE THEATRE

   A sibling of docs/index.html and deliberately built from the same tokens:
   same ink, same panel, same Newsreader/Plex pairing, same band tags, same
   provenance mode. A reader arriving from the dashboard should not feel they
   have left the building.

   What is different is the job. The dashboard reports a hundred thousand runs;
   this page shows exactly one, slowly enough to watch. So the centrepiece is
   not a chart -- it is the chain itself, ruling guard by guard, with a
   transport control, because the single most persuasive thing this system does
   is decline to act and say which clause made it decline.

   Two rules the code keeps everywhere:

     1. Nothing is recovered by parsing prose. Decisions come from
        `verdicts[].decision`, outcomes from `receipts[].outcome`, times from
        `at` and `defer_until`. The demo's English summary is quoted verbatim
        as what it is -- a log line -- and never mined for words.

     2. Nothing here knows what a card is. A step carrying verdicts is a
        ruling, a step carrying receipts is a seal, a step carrying neither is
        fact. That is the whole dispatch, which is why the same page will
        replay a mandate episode without an edit.
   ========================================================================= */

:root{
  /* --- shared with docs/index.html; do not drift ------------------------ */
  --ink:#0B1221;
  --panel:#121B30;
  --hairline:rgba(255,255,255,.08);
  --signal-blue:#2D68E6;
  --compliant-green:#00C96D;
  --violation-red:#D13B3B;
  --caution-amber:#F4C430;
  --paper:#EDEAE0;
  --font-display:'Newsreader',Georgia,'Times New Roman',serif;
  --font-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --viz-axis:rgba(255,255,255,.22);
  --viz-muted:#898781;
  --status-good:#0ca30c;
  --status-warning:#fab219;

  /* --- local ------------------------------------------------------------ */
  --ink-lift:#0E1729;
  --panel-lift:#16203A;
  --hairline-firm:rgba(255,255,255,.17);
  --body-text:#E2E8F0;
  --dim:#94A3B8;
  --dimmer:#64748B;
  --na:#5A688A;
  --blue-lift:#4A7DEE;
}

*{box-sizing:border-box;margin:0;padding:0}
html{background:var(--ink);scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{background:var(--ink);color:var(--body-text);font-family:var(--font-body);
  font-size:15.5px;line-height:1.62;-webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;display:flex;min-height:100vh}
:focus-visible{outline:2px solid var(--blue-lift);outline-offset:3px;border-radius:2px}
code{font-family:var(--font-mono);font-size:.88em;color:#B9C4DA}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0}
.num{font-variant-numeric:tabular-nums}

.shell{display:none}

/* ---------- provenance mode (the dashboard's control, same behaviour) ---- */
.prov-toggle{position:fixed;top:20px;right:20px;z-index:200;
  display:inline-flex;align-items:center;gap:9px;padding:9px 14px;border-radius:6px;cursor:pointer;
  background:rgba(18,27,48,.92);backdrop-filter:blur(8px);border:1px solid var(--hairline);
  color:var(--paper);font-family:var(--font-mono);font-size:11.5px;letter-spacing:.02em;
  transition:border-color .18s,background .18s}
.prov-toggle:hover{border-color:var(--signal-blue)}
.prov-toggle[aria-pressed="true"]{border-color:var(--signal-blue);background:rgba(45,104,230,.18)}
.prov-dot{width:8px;height:8px;border-radius:50%;background:var(--viz-muted);flex:none}
.prov-toggle[aria-pressed="true"] .prov-dot{background:var(--signal-blue)}
.prov-banner{display:none;border:1px solid rgba(45,104,230,.4);background:rgba(45,104,230,.08);
  border-radius:6px;padding:17px 21px;margin:28px 0 0;font-size:14.5px;line-height:1.7;
  color:var(--paper)}
body.provenance .prov-banner{display:block}
.prov-path{display:none!important;font-family:var(--font-mono);font-size:10px;line-height:1.5;
  color:var(--signal-blue);word-break:break-all;margin-top:5px;letter-spacing:.01em;
  flex-basis:100%}
body.provenance .prov-path{display:block!important}
body.provenance [data-src]{outline:1px dashed rgba(45,104,230,.5);outline-offset:3px;
  border-radius:2px}
@media(max-width:1080px){.prov-toggle{display:none}}

/* ---------- the spine, and the geometry it belongs to -------------------
   Lifted from docs/index.html rather than re-invented. This page and the
   dashboard are two volumes of one document, and a reader arriving here from
   the report card should not have to work out that they are still in the same
   building: same 72px rail, same 48px gutter, same 1200px measure. The marks
   are T for the top and I/II/III for the three acts. */
#spine{width:72px;border-right:1px solid var(--hairline);display:flex;flex-direction:column;
  align-items:center;padding:40px 0;position:fixed;height:100vh;overflow:hidden;z-index:10;
  background:var(--ink)}
.spine-mark{font-family:var(--font-mono);font-size:11px;letter-spacing:.06em;color:#64748B;
  text-decoration:none;min-width:26px;height:26px;padding:0 5px;
  display:flex;align-items:center;justify-content:center;margin:3px 0;
  border:1px solid transparent;border-radius:2px;
  transition:color .18s ease,border-color .18s ease,background-color .18s ease}
.spine-mark:hover{color:#CBD5E1;border-color:var(--hairline)}
.spine-mark:focus-visible{outline:2px solid var(--signal-blue);outline-offset:2px}
.spine-mark.is-here{color:var(--paper);border-color:var(--signal-blue);
  background:rgba(45,104,230,.14)}
.spine-progress{margin-top:auto;width:2px;height:84px;background:var(--hairline);
  border-radius:1px;overflow:hidden}
.spine-progress-fill{width:100%;height:0%;background:var(--signal-blue);
  transition:height .12s linear}

#content{margin:0 auto;margin-left:72px;padding:48px;flex-grow:1;max-width:1200px;
  /* Without this a flex item's min-width resolves to `auto`, so the container
     refuses to shrink below its widest child and the whole page scrolls
     sideways instead of the one wide box inside it. */
  min-width:0}
@media(max-width:820px){
  #spine{display:none}
  #content{margin-left:0;padding:28px 20px 64px}
}

/* ---------- brand header ------------------------------------------------ */
.brand-header{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.brand-header img{height:32px;width:auto;display:block;filter:brightness(0) invert(1)}
.brand-header h2{font-family:var(--font-display);font-size:24px;font-weight:600;color:#E2E8F0;
  letter-spacing:-.5px;display:flex;align-items:center;gap:12px}
.brand-header .vasool-tag{background:var(--signal-blue);color:#fff;padding:4px 10px;
  border-radius:4px;font-size:14px;font-family:var(--font-mono);font-weight:500}
.brand-header .back{margin-left:auto;font-family:var(--font-mono);font-size:12px;
  color:#94A3B8;text-decoration:none;border-bottom:1px solid var(--hairline);
  padding-bottom:2px;transition:color .16s,border-color .16s}
.brand-header .back:hover{color:#fff;border-color:var(--signal-blue)}

/* ---------- episode selector -------------------------------------------- */
/* The dashboard has one page and needs no selector; this one has five
   episodes, so the control lives in the content column rather than in a
   masthead the dashboard does not have. */
.picker{border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);
  padding:14px 0;margin-bottom:44px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.picker .plabel{font-family:var(--font-mono);font-size:10px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--dimmer);flex:0 0 auto}
.tablist{display:flex;gap:4px;flex-wrap:wrap;min-width:0}
.tab{flex:0 0 auto;white-space:nowrap;cursor:pointer;font-family:var(--font-mono);
  font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--dimmer);
  background:none;border:1px solid transparent;border-radius:3px;padding:6px 10px;
  transition:color .16s,border-color .16s,background-color .16s}
.tab:hover{color:#CBD5E1;border-color:var(--hairline)}
.tab[aria-selected="true"]{color:var(--paper);border-color:var(--signal-blue);
  background:rgba(45,104,230,.16)}

/* ---------- hero --------------------------------------------------------- */
.hero{padding:0 0 8px;display:grid;gap:clamp(30px,4vw,52px);
  grid-template-columns:minmax(0,1.32fr) minmax(310px,.68fr);align-items:start}
.hero>.hero-main{min-width:0}
.hero>.wait,.hero>.facts-line,.hero>.prov-banner{grid-column:1 / -1}
@media(max-width:920px){
  .hero{grid-template-columns:minmax(0,1fr)}
  .hero>.glance{grid-column:1}
}
.kicker{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:22px}
.kicker .sep{color:var(--hairline-firm);margin:0 9px}
.verdict{font-family:var(--font-display);font-weight:600;
  font-size:clamp(38px,7vw,74px);line-height:1.02;letter-spacing:-.015em;
  font-variation-settings:"opsz" 60;max-width:16ch;text-wrap:balance}
.verdict .join{font-weight:400;color:var(--dimmer);font-size:.62em;letter-spacing:0}
.v-defer{color:var(--caution-amber)} .v-allow{color:var(--compliant-green)}
.v-block{color:var(--violation-red)} .v-escalate{color:var(--signal-blue)}
.v-recover{color:var(--compliant-green)}
.dek{margin-top:20px;font-size:17.5px;line-height:1.56;color:var(--dim);max-width:60ch}
.dek b{color:var(--paper);font-weight:500}
.dek .clause{color:var(--caution-amber);font-weight:500}
.dek code{font-size:.9em}

.hero-acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:30px}
.cta{display:inline-flex;align-items:center;gap:9px;cursor:pointer;
  font-family:var(--font-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;
  border-radius:4px;padding:12px 17px;border:1px solid var(--hairline-firm);
  background:none;color:var(--paper);text-decoration:none;transition:.16s}
.cta:hover{border-color:#CBD5E1}
.cta.primary{background:var(--signal-blue);border-color:var(--signal-blue)}
.cta.primary:hover{background:var(--blue-lift);border-color:var(--blue-lift)}
.cta .glyph{font-size:10px;line-height:1}

.chip{display:inline-flex;align-items:center;gap:9px;margin-top:24px;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.05em;
  border:1px solid var(--hairline-firm);border-radius:999px;padding:6px 14px;color:var(--dim)}
.chip .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
.chip.sim .dot{background:var(--caution-amber)}
.chip.obs .dot{background:var(--compliant-green)}

/* ---------- the glance: the whole chain as one dense mark --------------- */
/* Thirteen ticks per ruling, coloured by what each guard actually returned.
   It is the page's only decorative-looking object and it is not decorative:
   every tick is one verdict, and the amber one is the reason the episode has
   a story. Clicking a row runs that ruling on the board. */
.glance{border:1px solid var(--hairline-firm);border-radius:6px;background:var(--panel);
  overflow:hidden;backdrop-filter:blur(2px)}
.glance .gh{padding:13px 16px;border-bottom:1px solid var(--hairline);background:var(--ink-lift);
  font-family:var(--font-mono);font-size:10px;letter-spacing:.15em;text-transform:uppercase;
  color:var(--dimmer)}
.glance .grow2{all:unset;display:block;box-sizing:border-box;width:100%;cursor:pointer;
  padding:14px 16px;border-bottom:1px solid var(--hairline);transition:background-color .16s}
.glance .grow2:hover,.glance .grow2:focus-visible{background:rgba(255,255,255,.028)}
.glance .gl1{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.glance .gwhen{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--dim);
  font-variant-numeric:tabular-nums}
.glance .gres{margin-left:auto;font-family:var(--font-mono);font-size:10px;font-weight:500;
  letter-spacing:.13em}
.bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.bars i{flex:1 1 0;min-width:2px;border-radius:1px;display:block;
  transform-origin:bottom;transition:height .34s cubic-bezier(.2,.8,.2,1),background-color .2s}
.bars i.b-na{height:7px;background:rgba(90,104,138,.5)}
.bars i.b-allow{height:14px;background:rgba(0,201,109,.55)}
.bars i.b-defer{height:26px;background:var(--caution-amber);box-shadow:0 0 9px rgba(244,196,48,.55)}
.bars i.b-escalate{height:26px;background:var(--signal-blue);box-shadow:0 0 9px rgba(45,104,230,.6)}
.bars i.b-block{height:26px;background:var(--violation-red);box-shadow:0 0 9px rgba(209,59,59,.6)}
.glance .gseal{display:flex;flex-direction:column;gap:8px}
.glance .ghash{font-family:var(--font-mono);font-size:10px;color:var(--dim);
  word-break:break-all;letter-spacing:.02em}
.glance .gfoot{padding:12px 16px;font-family:var(--font-mono);font-size:10.5px;line-height:1.65;
  color:var(--dimmer)}
.glance .gfoot b{color:var(--dim);font-weight:400}

/* ---------- the wait -------------------------------------------------- */
/* The one thing worth remembering about this episode is that a machine which
   could have sent the message at 19:30 did not, and waited twelve hours and
   thirty-nine minutes because a rule said so. That belongs at hero scale, in
   the display face, with the clause that caused it underneath -- not as the
   third of four stat boxes. Every number in it is read from the ledger. */
.wait{border-top:1px solid var(--hairline-firm);border-bottom:1px solid var(--hairline);
  padding:26px 0 24px;position:relative}
.wait .wl{font-family:var(--font-mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:20px}
.wait .track{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:0 18px;
  align-items:center}
.wait .anchor{font-family:var(--font-mono);font-size:12.5px;color:var(--paper);line-height:1.5;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.wait .anchor small{display:block;font-size:10px;color:var(--dimmer);letter-spacing:.06em;
  margin-top:4px}
.wait .anchor.to{text-align:right}
.wait .rail2{position:relative;height:56px;display:flex;align-items:center}
.wait .rail2::before{content:'';position:absolute;left:0;right:0;top:50%;height:2px;
  background:linear-gradient(90deg,var(--caution-amber),rgba(244,196,48,.28));border-radius:1px}
.wait .rail2 .cap{position:absolute;top:50%;width:9px;height:9px;border-radius:50%;
  background:var(--caution-amber);transform:translateY(-50%);box-shadow:0 0 12px rgba(244,196,48,.7)}
.wait .rail2 .cap.a{left:-1px} .wait .rail2 .cap.b{right:-1px}
.wait .span{position:relative;margin:0 auto;padding:0 20px;background:var(--ink);
  font-family:var(--font-display);font-size:clamp(30px,4.4vw,46px);font-weight:600;
  line-height:1;color:var(--caution-amber);font-variation-settings:"opsz" 40;
  font-variant-numeric:tabular-nums;white-space:nowrap}
.wait .why{margin-top:20px;font-family:var(--font-mono);font-size:11.5px;line-height:1.75;
  color:var(--dim);max-width:84ch}
.wait .why b{color:var(--paper);font-weight:500}
.wait .why .clause{color:var(--caution-amber)}
.wait .why q{color:#B9C4DA;font-style:normal}
/* the no-deferral variant: one moment, and a refusal */
.wait.stood .rail2::before{background:linear-gradient(90deg,var(--stood),rgba(255,255,255,.06))}
.wait.stood .rail2 .cap{background:var(--stood);box-shadow:0 0 12px var(--stood)}
.wait.stood .track{grid-template-columns:auto minmax(0,1fr)}
.wait.stood .span{color:var(--stood);font-size:clamp(24px,3.4vw,36px)}

/* a single confident line of facts, not four boxes saying it again */
.facts-line{margin-top:22px;display:flex;flex-wrap:wrap;gap:6px 0;
  font-family:var(--font-mono);font-size:11.5px;color:var(--dim);letter-spacing:.03em}
/* `:not(.prov-path)` on both rules, because a bare `.facts-line span` beats
   `.prov-path{display:none}` on specificity and was showing every JSON path
   with provenance mode switched off. */
.facts-line span:not(.prov-path){display:inline-flex;align-items:center;gap:6px}
.facts-line span:not(.prov-path)+span:not(.prov-path)::before{content:'·';
  color:var(--hairline-firm);margin:0 12px 0 6px}
.facts-line b{color:var(--paper);font-weight:500}
.facts-line b.sim{color:var(--caution-amber)}
.facts-line b.obs{color:var(--compliant-green)}
.facts-line span:not(.prov-path) span::before{content:none}
.tile .tv{font-family:var(--font-display);font-size:31px;font-weight:600;line-height:1.04;
  color:var(--paper);font-variation-settings:"opsz" 40;font-variant-numeric:tabular-nums}
.tile .tv.word{font-family:var(--font-mono);font-size:13.5px;font-weight:500;letter-spacing:.12em;
  padding:7px 0 8px}
.tile .tl{font-family:var(--font-mono);font-size:10.5px;color:var(--dimmer);margin-top:9px;
  line-height:1.6}

/* ---------- act scaffolding ---------------------------------------------- */
/* Exhibit scaffolding, identical to the dashboard's. Volume two of the same
   document: the report card runs A-I, this one runs T1-T3. */
.exhibit{margin-bottom:80px;margin-top:72px;position:relative;scroll-margin-top:24px}
.band-tag{display:inline-block;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.08em;
  text-transform:uppercase;padding:4px 10px;border-radius:3px;margin-bottom:15px}
.band-independent .band-tag{background:rgba(12,163,12,.15);color:var(--status-good)}
.band-dependent .band-tag{background:rgba(250,178,25,.13);color:var(--status-warning)}
.exhibit-title{font-family:var(--font-mono);font-size:13px;color:#94A3B8;
  text-transform:uppercase;letter-spacing:1px;margin-bottom:24px;display:flex;
  align-items:center}
.exhibit-title::before{content:'';display:inline-block;width:24px;height:1px;
  background:var(--hairline);margin-right:12px;flex:0 0 auto}
.standfirst{font-size:15.5px;line-height:1.68;color:var(--dim);max-width:74ch}
.standfirst b{color:var(--paper);font-weight:500}
.standfirst em{font-style:italic;color:#B9C4DA}
.footnote{margin-top:22px;padding-top:15px;border-top:1px solid var(--hairline);
  font-family:var(--font-mono);font-size:11.5px;line-height:1.75;color:var(--dim);max-width:90ch}
.footnote b{color:var(--paper);font-weight:500}

/* ---------- THE BOARD: thirteen guards, ruling ---------------------------- */
.board{margin-top:26px;border:1px solid var(--hairline-firm);border-radius:6px;
  background:var(--panel);overflow:hidden}

.transport{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;
  padding:13px 16px;border-bottom:1px solid var(--hairline);background:var(--ink-lift)}
.tbtn{display:inline-flex;align-items:center;gap:8px;cursor:pointer;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
  background:none;border:1px solid var(--hairline-firm);border-radius:3px;color:var(--paper);
  padding:8px 12px;transition:.16s}
.tbtn:hover:not([disabled]){border-color:#CBD5E1}
.tbtn[disabled]{opacity:.35;cursor:not-allowed}
.tbtn.play{background:var(--signal-blue);border-color:var(--signal-blue)}
.tbtn.play:hover:not([disabled]){background:var(--blue-lift);border-color:var(--blue-lift)}
.tbtn .glyph{font-size:9px;line-height:1}
.transport .spacer{flex:1 1 auto}
.cycle-dots{display:flex;gap:6px}
.cycle-dots button{width:9px;height:9px;padding:0;border-radius:50%;cursor:pointer;
  border:1px solid var(--hairline-firm);background:none;transition:.16s}
.cycle-dots button[aria-current="true"]{background:var(--signal-blue);border-color:var(--signal-blue)}
.cycle-dots button:hover{border-color:#CBD5E1}
.transport .pos{font-family:var(--font-mono);font-size:11px;letter-spacing:.07em;
  color:var(--dim);font-variant-numeric:tabular-nums}

.slate{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-start;
  padding:16px;border-bottom:1px solid var(--hairline)}
.slate .cell{min-width:0}
.slate .lb{font-family:var(--font-mono);font-size:9.5px;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dimmer);margin-bottom:6px}
.slate .vv{font-family:var(--font-mono);font-size:13px;color:var(--paper);word-break:break-word}
.slate .when{color:var(--caution-amber)}
.slate .verdict-cell{margin-left:auto;text-align:right}
.slate .big{font-family:var(--font-display);font-size:30px;font-weight:600;line-height:1;
  font-variation-settings:"opsz" 40;transition:opacity .3s}
.slate .big.pending{opacity:.16;color:var(--dimmer)}

/* the day strip lives in the slate: it is what makes "why 08:09" legible */
.strip{width:100%;padding:2px 0 0}
.strip svg{display:block;width:100%;height:auto;overflow:visible}

.rows{list-style:none}
.grow{display:grid;grid-template-columns:34px minmax(0,1fr) 128px;gap:0 14px;align-items:baseline;
  padding:11px 16px;border-bottom:1px solid var(--hairline);
  transition:background-color .28s ease,opacity .28s ease}
.grow:last-child{border-bottom:0}
.grow .ix{font-family:var(--font-mono);font-size:10.5px;color:var(--dimmer);
  font-variant-numeric:tabular-nums;letter-spacing:.04em}
.grow .gname{font-family:var(--font-mono);font-size:13px;color:var(--paper);line-height:1.42}
.grow .gstat{display:block;font-family:var(--font-mono);font-size:10px;color:var(--dimmer);
  line-height:1.55;margin-top:4px}
.grow .gsaid{display:block;font-family:var(--font-mono);font-size:11px;line-height:1.6;
  margin-top:7px;color:var(--dim);max-width:64ch}
.grow .gobl{display:block;font-family:var(--font-mono);font-size:10px;line-height:1.55;
  margin-top:5px;color:var(--signal-blue)}
.grow .call{font-family:var(--font-mono);text-align:right;white-space:nowrap}
/* Three visual weights, and the ramp is the semantics: a filled chip is a
   guard that intervened, an outlined one allowed, a dashed hollow one had no
   jurisdiction. NOT_APPLICABLE must never be able to read as a green tick --
   the enum's own docstring insists on the distinction and so does the page. */
.chipd{display:inline-flex;align-items:center;padding:4px 9px;border-radius:3px;
  font-family:var(--font-mono);font-size:9.5px;font-weight:500;letter-spacing:.12em;
  border:1px solid transparent}
.chipd.c-allow{color:var(--compliant-green);background:rgba(0,201,109,.09);
  border-color:rgba(0,201,109,.3)}
.chipd.c-na{color:var(--na);background:none;border-color:rgba(90,104,138,.45);border-style:dashed}
.chipd.c-defer{color:#231A00;background:var(--caution-amber);border-color:var(--caution-amber)}
.chipd.c-block{color:#fff;background:var(--violation-red);border-color:var(--violation-red)}
.chipd.c-escalate{color:#fff;background:var(--signal-blue);border-color:var(--signal-blue)}
.grow .held{display:block;font-family:var(--font-mono);font-size:10px;color:var(--caution-amber);
  margin-top:5px;letter-spacing:.02em}

/* the reveal: each guard rules in turn, so the chain is something you watch */
.grow:hover{background:rgba(255,255,255,.022)}
.grow.pending{opacity:.12;transform:translateY(3px)}
.grow.pending .call{visibility:hidden}
.grow.settled{opacity:1;transform:none}
.grow.just{background:rgba(45,104,230,.14)}
.grow{transition:background-color .28s ease,opacity .26s ease,transform .26s cubic-bezier(.2,.8,.2,1)}
.grow.loud{box-shadow:inset 3px 0 0 currentColor}
.grow.loud.is-defer{color:var(--caution-amber)}
.grow.loud.is-block{color:var(--violation-red)}
.grow.loud.is-escalate{color:var(--signal-blue)}
.grow.quiet .gname{color:#B9C4DA}
.grow.na .gname{color:var(--na)} .grow.na .gstat{color:#2E3A54}
.grow.moved .gname::after{content:'moved';font-family:var(--font-mono);font-size:8.5px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:var(--signal-blue);
  border-radius:2px;padding:2px 5px;margin-left:10px;vertical-align:2px}

.d-allow{color:var(--compliant-green)} .d-defer{color:var(--caution-amber)}
.d-block{color:var(--violation-red)} .d-escalate{color:var(--signal-blue)} .d-na{color:var(--na)}

.tally{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:baseline;
  padding:14px 16px;border-top:1px solid var(--hairline-firm);background:rgba(255,255,255,.022)}
.tally .lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--dimmer)}
.tally .txt{font-family:var(--font-mono);font-size:11.5px;color:var(--dim);line-height:1.6}
.tally .txt b{color:var(--paper);font-weight:500}
.tally .agree{margin-left:auto;font-family:var(--font-mono);font-size:10.5px;color:var(--dim);
  letter-spacing:.03em}
.tally .agree::before{content:'✓ ';color:var(--compliant-green)}
.tally .agree.no::before{content:'✕ ';color:var(--violation-red)}
.tally .agree.no{color:var(--violation-red)}

/* compare-all-cycles table, folded away by default */
.compare{margin-top:20px}
.compare>summary{cursor:pointer;font-family:var(--font-mono);font-size:11.5px;color:var(--dim);
  letter-spacing:.05em;padding:8px 0}
.compare>summary:hover{color:var(--paper)}
.scroller{margin-top:12px;overflow-x:auto;border:1px solid var(--hairline);border-radius:6px}
table.chain{border-collapse:collapse;width:100%;min-width:620px;background:var(--panel)}
table.chain caption{text-align:left;padding:13px 15px;font-family:var(--font-mono);font-size:10.5px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer);
  border-bottom:1px solid var(--hairline)}
table.chain th,table.chain td{text-align:left;vertical-align:top;padding:11px 15px;
  border-bottom:1px solid var(--hairline)}
table.chain thead th{background:var(--ink-lift);font-family:var(--font-mono);font-weight:400;
  font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--dimmer);
  border-bottom-color:var(--hairline-firm)}
table.chain thead th .at{display:block;margin-top:5px;font-size:11px;letter-spacing:.02em;
  text-transform:none;color:var(--caution-amber)}
table.chain tbody th{position:sticky;left:0;z-index:2;background:var(--panel);font-weight:400;
  min-width:200px}
table.chain tbody th .gn{font-family:var(--font-mono);font-size:12px;color:var(--paper)}
table.chain tbody th .st{display:block;font-family:var(--font-mono);font-size:9.5px;
  color:var(--dimmer);line-height:1.5;margin-top:4px}
table.chain td .dc{font-family:var(--font-mono);font-size:10.5px;font-weight:500;letter-spacing:.11em}
tr.dim th .gn{color:var(--na)} tr.dim th .st{color:#2E3A54}
tr.moved{background:rgba(45,104,230,.085)}
tr.moved th{background:var(--panel-lift);box-shadow:inset 2px 0 0 var(--signal-blue)}
table.chain tfoot th,table.chain tfoot td{border-top:1px solid var(--hairline-firm);border-bottom:0;
  background:rgba(255,255,255,.022);font-family:var(--font-mono);font-size:11px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--dimmer)}
table.chain tfoot td{color:var(--paper)}
table.chain tfoot th{position:sticky;left:0;background:#141C31}

/* ---------- the record --------------------------------------------------- */
.reel{margin-top:26px}
.beat{position:relative;padding:0 0 2px 44px}
.beat::before{content:'';position:absolute;left:13px;top:26px;bottom:-2px;width:1px;
  background:var(--hairline)}
.beat:last-child::before{display:none}
.beat .pin{position:absolute;left:0;top:9px;width:27px;height:27px;border-radius:50%;
  border:1px solid var(--hairline-firm);background:var(--ink);color:var(--dimmer);
  font-family:var(--font-mono);font-size:10.5px;display:flex;align-items:center;
  justify-content:center;font-variant-numeric:tabular-nums}
.beat.is-ruling .pin{border-color:var(--signal-blue);color:var(--paper)}
.beat.is-seal .pin{border-color:var(--compliant-green);color:var(--compliant-green)}
.beat .hd{display:flex;flex-wrap:wrap;align-items:baseline;gap:5px 14px;padding:13px 0 0}
.beat .ttl{font-family:var(--font-mono);font-size:13px;letter-spacing:.03em;color:var(--paper)}
.beat .when{font-family:var(--font-mono);font-size:11px;color:var(--dimmer);letter-spacing:.04em}
.beat .body{padding:11px 0 24px}

.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(258px,1fr));gap:0 30px;
  border-top:1px solid var(--hairline)}
.facts.wide{grid-template-columns:1fr}
.facts>div{display:grid;grid-template-columns:100px minmax(0,1fr);gap:12px;padding:9px 0;
  border-bottom:1px solid var(--hairline);align-items:baseline}
.facts dt{font-family:var(--font-mono);font-size:10.5px;color:var(--dimmer)}
.facts dd{font-family:var(--font-mono);font-size:12.5px;color:var(--paper);word-break:break-word}
.transcript{margin-top:13px;font-family:var(--font-mono);font-size:11.5px;line-height:1.78;
  color:var(--dim);border-left:2px solid var(--hairline-firm);padding:2px 0 2px 14px;max-width:82ch}

.recap{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;
  border:1px solid var(--hairline);border-radius:5px;background:var(--panel);padding:13px 16px}
.recap .rv{font-family:var(--font-display);font-size:21px;font-weight:600;line-height:1;
  font-variation-settings:"opsz" 30}
.recap .rt{font-family:var(--font-mono);font-size:11.5px;color:var(--dim);line-height:1.6;min-width:0}
.recap .rt b{color:var(--paper);font-weight:500}
.recap .jump{margin-left:auto;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;background:none;border:1px solid var(--hairline-firm);border-radius:3px;
  color:var(--dim);padding:8px 11px;cursor:pointer;transition:.16s;flex:0 0 auto}
.recap .jump:hover{color:var(--paper);border-color:#CBD5E1}

.stub{border:1px solid var(--hairline);border-radius:5px;background:var(--panel);padding:13px 16px}
.stub .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px}
.stub .rid{font-family:var(--font-mono);font-size:12.5px;color:var(--paper)}
.stub .oc{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  margin-left:auto}
.stub .hs{font-family:var(--font-mono);font-size:10.5px;color:var(--dimmer);margin-top:8px;
  line-height:1.75;word-break:break-all}
.stub .hs b{color:var(--dim);font-weight:400}

.replay{margin-top:26px;border:1px solid var(--hairline);border-radius:5px;overflow:hidden;
  background:var(--ink-lift)}
.replay .cap{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dimmer);padding:9px 14px;border-bottom:1px solid var(--hairline)}
.replay .cmd{display:flex;align-items:flex-start;gap:12px;padding:12px 14px}
.replay .cmd pre{margin:0;font-family:var(--font-mono);font-size:12.5px;line-height:1.7;
  color:var(--paper);white-space:pre-wrap;word-break:break-word;flex:1 1 auto}
.replay .cmd pre .sigil{color:var(--dimmer)}
.copy{flex:0 0 auto;font-family:var(--font-mono);font-size:10px;letter-spacing:.1em;
  text-transform:uppercase;background:none;border:1px solid var(--hairline-firm);border-radius:3px;
  color:var(--dim);padding:6px 10px;cursor:pointer;transition:.16s}
.copy:hover{color:var(--paper);border-color:#CBD5E1}

/* ---------- the seal ----------------------------------------------------- */
.links{margin-top:26px}
.node{border:1px solid var(--hairline);border-radius:5px;background:var(--panel);
  transition:border-color .16s,box-shadow .16s}
.node.sel{border-color:var(--signal-blue);box-shadow:0 0 0 1px rgba(45,104,230,.32)}
.node>button{all:unset;box-sizing:border-box;cursor:pointer;display:block;width:100%;padding:14px 16px}
.node>button:hover .rid{color:var(--blue-lift)}
.node .l1{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin-bottom:9px}
.node .rid{font-family:var(--font-mono);font-size:12.5px;color:var(--paper);transition:color .16s}
.node .oc{font-family:var(--font-mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;
  margin-left:auto}
.node .hs{font-family:var(--font-mono);font-size:10.5px;color:var(--dimmer);line-height:1.85;
  word-break:break-all}
.node .hs b{color:var(--dim);font-weight:400}
.node.broken{border-color:var(--violation-red);
  box-shadow:0 0 0 1px rgba(209,59,59,.3),0 0 22px rgba(209,59,59,.14)}
.node.broken .rid{color:var(--violation-red)}
.node.broken .l1::after{content:'seal broken';font-family:var(--font-mono);font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;color:#fff;background:var(--violation-red);
  border-radius:2px;padding:3px 6px;order:9}
.node.tainted{border-style:dashed;border-color:rgba(209,59,59,.4);opacity:.62}
.node.tainted .l1::after{content:'unverifiable';font-family:var(--font-mono);font-size:9px;
  letter-spacing:.15em;text-transform:uppercase;color:var(--violation-red);
  border:1px dashed rgba(209,59,59,.55);border-radius:2px;padding:2px 6px;order:9}
.tie{display:flex;align-items:center;gap:11px;padding:8px 0 8px 19px;font-family:var(--font-mono);
  font-size:10.5px;color:var(--dimmer);letter-spacing:.05em;transition:color .2s}
.tie .el{color:var(--hairline-firm);font-size:15px}
.tie.severed{color:var(--violation-red)}
.tie.severed .el{color:var(--violation-red)}

/* Exhibit H's verifier, same chrome. The interaction differs on purpose: the
   dashboard looks a receipt up, this page hands you its bytes and invites you
   to break them, which is the thing a static page cannot fake. */
.verifier-box{background:var(--panel);border:1px solid var(--hairline);padding:32px;
  border-radius:2px;font-family:var(--font-mono);position:relative;margin-top:32px}
.verifier-box h3{font-family:var(--font-display);font-size:20px;font-weight:600;
  margin-bottom:16px;font-variation-settings:"opsz" 30}
.verifier-box .lede2{margin-bottom:24px;color:#94A3B8;font-family:var(--font-body);
  font-size:14px;line-height:1.62;max-width:72ch}
.verifier-box .lede2 b{color:var(--paper);font-weight:500}
.input-group{display:flex;gap:16px;margin-bottom:24px;flex-wrap:wrap}
#verifier-console{background:var(--ink);padding:16px;min-height:120px;font-size:13px;
  color:#94A3B8;white-space:pre-wrap;word-wrap:break-word;line-height:1.7;
  border:1px solid var(--hairline)}
.console-success{color:var(--compliant-green)}
.console-error{color:var(--violation-red)}

/* The stamp the dashboard uses for a failed claim. A forged receipt earns it. */
.rubber-stamp{position:absolute;top:24px;right:24px;font-family:var(--font-display);
  font-size:22px;font-weight:600;color:rgba(209,59,59,.95);border:4px solid rgba(209,59,59,.95);
  padding:8px 16px;text-transform:uppercase;letter-spacing:2px;transform:rotate(-15deg);
  z-index:10;pointer-events:none;mix-blend-mode:screen}
textarea.bytes{display:block;font-family:var(--font-mono);font-size:11px;line-height:1.9;width:100%;
  margin-bottom:24px;min-height:150px;resize:vertical;background:var(--ink);color:var(--dim);
  border:1px solid var(--hairline-firm);border-radius:5px;padding:14px;word-break:break-all;
  transition:border-color .16s,color .16s}
textarea.bytes:focus{border-color:var(--caution-amber);color:var(--paper)}
textarea.bytes.dirty{border-color:var(--violation-red)}
/* Sixty-four hex digits are the most graphic object on this page and they were
   set at body size. At this scale the comparison is the exhibit: two rows,
   digit under digit, and when a byte is forged you can see from across the
   room how little of the digest survived. */
.hexrow{margin-top:22px}
.hexrow .lb{font-family:var(--font-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--dimmer);margin-bottom:9px}
.hexline{display:flex;flex-wrap:wrap;gap:6px clamp(7px,1vw,13px);font-family:var(--font-mono);
  font-size:clamp(12px,1.62vw,21px);line-height:1.5;font-variant-numeric:tabular-nums}
.hexline .grp{display:flex}
.hexline .grp span{width:1.08ch;text-align:center;color:var(--dim);
  transition:color .18s,background-color .18s}
.hexline .grp span.on{color:var(--compliant-green)}
.hexline .grp span.off{color:#fff;background:var(--violation-red);border-radius:2px;
  box-shadow:0 0 10px rgba(209,59,59,.45)}
.hexrow.sealed .hexline{color:var(--paper)}
.hexrow.sealed .grp span{color:#B9C4DA}
.state{margin-top:24px;display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 20px}
.state .word{font-family:var(--font-display);font-size:clamp(28px,4.2vw,40px);font-weight:600;
  line-height:1;font-variation-settings:"opsz" 40}
.state .word.ok{color:var(--compliant-green)} .state .word.bad{color:var(--violation-red)}
.state .said{font-size:14px;color:var(--dim);max-width:60ch;line-height:1.62}
.state .said b{color:var(--paper);font-weight:500}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:22px}
.btn{font-family:var(--font-mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
  background:none;border:1px solid var(--hairline-firm);border-radius:3px;color:var(--paper);
  padding:10px 14px;cursor:pointer;transition:.16s}
.btn:hover:not([disabled]){border-color:#CBD5E1}
.btn.p{background:var(--signal-blue);border-color:var(--signal-blue)}
.btn.p:hover{background:var(--blue-lift);border-color:var(--blue-lift)}
.btn.danger{border-color:rgba(209,59,59,.55);color:#F2A9A9}
.btn.danger:hover{border-color:var(--violation-red);color:#fff}
.btn[disabled]{opacity:.38;cursor:not-allowed}

/* ---------- colophon ----------------------------------------------------- */
.colophon{margin:clamp(70px,9vw,104px) 0 0;padding:40px 0 72px;
  border-top:1px solid var(--hairline);font-family:var(--font-mono);font-size:11.5px;
  line-height:1.9;color:var(--dimmer);max-width:94ch}
.colophon b{color:var(--dim);font-weight:400}
.colophon a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--hairline)}
.colophon a:hover{color:#fff}

/* ---------- no JavaScript ------------------------------------------------ */
.noscript-panel{max-width:760px;margin:56px auto;padding:28px 32px;border:1px solid var(--hairline);
  background:var(--panel);font-size:15px;line-height:1.65}
.noscript-panel h1{font-family:var(--font-display);font-size:27px;margin:0 0 14px}
.noscript-panel p{margin:0 0 12px;color:var(--dim)}
.noscript-panel code{color:#B9C4DA}

/* ---------- responsive --------------------------------------------------- */
/* The strip is a bonus, not load-bearing: below this width its labels scale
   down with the viewBox until they are unreadable, and every fact it carries
   -- the moment, the hold, the span -- is already set in type in the slate. */
@media(max-width:640px){
  .strip{display:none}
  /* Stacked, because a wrapped inline list leaves separators orphaned at the
     start and end of lines. */
  .facts-line{flex-direction:column;align-items:flex-start;gap:8px}
  .facts-line span:not(.prov-path)+span:not(.prov-path)::before{content:none}
  .wait .track{grid-template-columns:1fr;gap:14px 0}
  .wait .anchor.to{text-align:left}
  .wait .rail2{height:42px}
}
@media(max-width:820px){
  .grow{grid-template-columns:28px minmax(0,1fr);gap:0 11px}
  .grow .call{grid-column:2;text-align:left;margin-top:7px}
  .slate .verdict-cell{margin-left:0;text-align:left}
  .beat{padding-left:37px}
  .beat .pin{width:23px;height:23px;font-size:10px}
  .beat::before{left:11px}
}

/* ---------- motion ------------------------------------------------------- */
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  html{scroll-behavior:auto}
  .grow.pending{opacity:1;transform:none}
  .grow.pending .call{visibility:visible}
}

/* ---------- print. Judges save PDFs; a dark ground prints as a slab. ------ */
@media print{
  :root{--ink:#fff;--ink-lift:#fff;--panel:#fff;--panel-lift:#fff;--paper:#111;--body-text:#111;
    --dim:#444;--dimmer:#666;--hairline:rgba(0,0,0,.16);--hairline-firm:rgba(0,0,0,.28)}
  body{background:#fff;color:#111}
  #spine,.prov-toggle,.transport,.hero-acts,.copy,.acts,.recap .jump,.picker{display:none!important}
  #content{margin-left:0;padding:0}
  .lockup img{filter:none}
  .act{break-inside:avoid;page-break-inside:avoid;margin-top:14mm}
  .act-title,h1,h2,h3{break-after:avoid;page-break-after:avoid}
  .grow.pending{opacity:1;transform:none}
  .grow.pending .call{visibility:visible}
  /* Colours set as literals rather than tokens do not follow the palette
     inversion above, and on white they come out as near-invisible grey.
     Every one of them is named here so nothing prints washed out. */
  code,.grow.quiet .gname,.grow.na .gname,.standfirst em,.hexline .grp span{color:#111}
  .grow.na .gstat,.tie,.node .hs{color:#555}
  .glance .gh,.slate .lb,.tally .lb,.hexrow .lb,.beat .when{color:#555}
  .node.tainted{opacity:1}
  .compare[open]>summary,.compare{display:block}
  .scroller,.bench-body{overflow:visible!important}
  textarea.bytes{min-height:0;height:auto;color:#111;border-color:rgba(0,0,0,.28)}
  .colophon{padding-bottom:0}
  a[href^="http"]::after{content:" (" attr(href) ")";font-size:9px;word-break:break-all}
}
</style>
